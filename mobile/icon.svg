<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="大肥鱼图标">
  <title>大肥鱼</title>
  <defs>
    <linearGradient id="whaleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172349" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fishSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c93ff" />
      <stop offset="0.55" stop-color="#4d6bfe" />
      <stop offset="1" stop-color="#3a52d8" />
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#whaleBg)" />
  <circle cx="64" cy="62" r="44" fill="#4d6bfe" opacity="0.12" />

  <!-- 鱼本体（整体略缩，保证 maskable 裁剪时不被切到） -->
  <g transform="translate(64 64) scale(0.86) translate(-64 -64)">
    <!-- 尾巴 -->
    <path d="M22 64 L44 46 L44 82 Z" fill="#3a52d8" />

    <!-- 上鳍 -->
    <path d="M60 44 Q66 24 82 32 Q74 38 70 46 Z" fill="#3a52d8" opacity="0.9" />

    <!-- 身体 -->
    <ellipse cx="68" cy="64" rx="30" ry="22" fill="url(#fishSkin)" />

    <!-- 肚皮 -->
    <ellipse cx="70" cy="72" rx="22" ry="10" fill="#e8eefc" opacity="0.22" />

    <!-- 眼睛 -->
    <circle cx="86" cy="57" r="4.6" fill="#0f172a" />
    <circle cx="84.6" cy="55.6" r="1.5" fill="#ffffff" opacity="0.95" />

    <!-- 腮线 -->
    <path d="M76 50 Q72 64 76 78" fill="none" stroke="#2c3eb0" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 一点 token 星光 -->
  <circle cx="30" cy="34" r="2.4" fill="#e8eefc" opacity="0.65" />
  <circle cx="100" cy="96" r="2" fill="#e8eefc" opacity="0.5" />
</svg>
